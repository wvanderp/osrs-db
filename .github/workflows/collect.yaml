name: Collect Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # This workflow is triggered manually or on Wednesdays at 2320 UTC
  # This should be after Jagex updates the cache
  schedule:
    - cron: "20 23 * * 3" # Every Wednesday at 23:20 UTC

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - name: ☕ Set up Java 11
        uses: actions/setup-java@v6.2.0
        with:
          distribution: "temurin"
          java-version: "11"
      - name: 📦 Install dependencies
        run: npm install
      - name: 🔧 Make all scripts executable
        run: chmod -R +x common tools/**/*.sh
      - name: ▶️ Run all tools
        run: npm run collect
      - name: 🚀✨ Commit & Push Data Changes
        uses: EndBug/add-and-commit@v11.1.1
        with:
          author_name: github_actions
          message: "🔄 Auto-update: add new data 📦"
