name: lint data

on:
  workflow_run:
    workflows: ["Collect Data"]
    types:
      - completed

jobs:
  run-linters:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Run linters
        run: npm run lint:data
