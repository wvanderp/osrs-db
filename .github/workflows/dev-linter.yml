name: Dev Linter

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run dev linter
        run: npm run lint:dev
